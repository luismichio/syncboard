<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SyncingBoard Companion UI</title>
  <style>
    :root {
      --bg-page: #0b0c0d;
      --bg-card: #121417;
      --border-card: #1f232a;
      --text-page: #f3f4f6;
      --text-muted: #6b7280;
      --accent: #01C8F1;
      --pulse-bg: rgba(1, 200, 241, 0.08);
      --pulse-border: rgba(1, 200, 241, 0.2);
    }
    body.theme-light {
      --bg-page: #f9fafb;
      --bg-card: #ffffff;
      --border-card: #e5e7eb;
      --text-page: #111827;
      --text-muted: #9ca3af;
      --accent: #00A2C9;
      --pulse-bg: rgba(0, 162, 201, 0.08);
      --pulse-border: rgba(0, 162, 201, 0.2);
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-page);
      color: var(--text-page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px solid var(--border-card);
      padding-bottom: 12px;
    }
    .version-badge {
      font-size: 9px;
      font-family: monospace;
      color: var(--text-muted);
      opacity: 0.6;
      margin-top: -2px;
    }
    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 10px;
      color: var(--text-muted);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .pairing-input-wrap {
      position: relative;
      flex: 1;
    }
    .pairing-input-wrap input {
      width: 100%;
      padding-right: 28px;
      box-sizing: border-box;
    }
    .pairing-eye-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none !important;
      border: none !important;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .pairing-eye-btn:hover {
      color: var(--text-page);
      opacity: 1 !important;
    }
    input[type="text"], input[type="password"] {
      flex: 1;
      background-color: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: 4px;
      color: var(--text-page);
      padding: 6px 8px;
      font-size: 12px;
      font-family: monospace;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      background-color: var(--accent);
      color: var(--bg-page);
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .badge {
      font-size: 9px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 12px;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-disconnected {
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.2);
    }
    .badge-connected {
      background-color: var(--pulse-bg);
      color: var(--accent);
      border-color: var(--pulse-border);
    }
    .badge-connecting {
      background-color: rgba(107, 114, 128, 0.1);
      color: var(--text-muted);
      border-color: rgba(107, 114, 128, 0.2);
    }
    .log-box {
      font-family: monospace;
      font-size: 10px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: 4px;
      padding: 8px;
      height: 80px;
      overflow-y: auto;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2>SyncingBoard Companion</h2>
      <p class="subtitle">Penpot Companion Relay</p>
      <span class="version-badge">v0.14.0 Community</span>
    </header>
    <div class="card">
      <label for="pairing-id">Pairing ID</label>
      <div class="input-row">
        <div class="pairing-input-wrap">
          <input type="password" id="pairing-id" placeholder="sb_xxxxx" />
          <button type="button" id="toggle-pairing-vis" class="pairing-eye-btn" aria-label="Show pairing ID">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <button id="connect-btn">Connect</button>
      </div>
    </div>
    <div class="card">
      <div class="status-row">
        <span>Cloud Connection (WebSocket):</span>
        <span id="status-badge" class="badge badge-disconnected">Disconnected</span>
      </div>
      <div class="status-row" style="margin-top: 4px;">
        <span>Penpot Sandbox (Local):</span>
        <span id="plugin-badge" class="badge badge-disconnected">Unknown</span>
      </div>

    </div>
    <div class="card">
      <label>Activity Log</label>
      <div id="log" class="log-box">Initialized. Ready to pair.</div>
    </div>
  </div>
  <script src="/ably-bundle.js"></script>
  <script>
    const RELAY_URL = window.location.origin;
    const FETCH_OPTIONS = { mode: 'cors' };
    const RECONNECT_DELAY_MS = 5000;

    let ablyClient = null;
    let ablyChannel = null;
    let reconnectTimeout = null;
    let reconnectAttempts = 0;
    let currentPairingId = '';

    const pendingRequests = new Map();
    const pairingInput = document.getElementById('pairing-id');
    const connectBtn = document.getElementById('connect-btn');
    const statusBadge = document.getElementById('status-badge');
    const pluginBadge = document.getElementById('plugin-badge');
    const logBox = document.getElementById('log');

    const savedId = localStorage.getItem('syncingboard_pairing_id');
    if (savedId) {
      pairingInput.value = savedId;
    }

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logBox.innerHTML += `<div>[${time}] ${message}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function updatePluginStatus(connected) {
      pluginBadge.textContent = connected ? 'Connected' : 'Disconnected';
      pluginBadge.className = 'badge';
      if (connected) {
        pluginBadge.classList.add('badge-connected');
      } else {
        pluginBadge.classList.add('badge-disconnected');
      }
    }

    function updateStatus(state, labelText) {
      statusBadge.textContent = labelText || state;
      statusBadge.className = 'badge';
      if (state === 'connected') {
        statusBadge.classList.add('badge-connected');
      } else if (state === 'connecting') {
        statusBadge.classList.add('badge-connecting');
      } else {
        statusBadge.classList.add('badge-disconnected');
      }
    }

    function clearReconnectTimer() {
      if (reconnectTimeout) {
        clearTimeout(reconnectTimeout);
        reconnectTimeout = null;
      }
    }

    function scheduleReconnect() {
      if (reconnectAttempts >= 5) {
        log('Connection failed after 5 attempts. Please click Connect to retry.');
        return;
      }
      reconnectAttempts++;
      clearReconnectTimer();
      reconnectTimeout = setTimeout(() => connectBridge(true), RECONNECT_DELAY_MS);
    }

    function handleCommand(request) {
      log(`Received command: "${request.action}"`);

      if (request.action === 'select') {
        pendingRequests.set(request.id, request);
        parent.postMessage({
          action: 'get-selection',
          requestId: request.id
        }, '*');
      }

      if (request.action === 'export') {
        pendingRequests.set(request.id, request);
        parent.postMessage({
          action: 'export-shape',
          requestId: request.id,
          shapeId: request.shapeId,
          format: request.format || 'svg',
          scale: request.scale || 2
        }, '*');
      }
    }

    async function disconnectAbly(reason) {
      if (ablyChannel) {
        try { ablyChannel.unsubscribe(); } catch (e) {}
        try {
          // Check state right before leave() to avoid detached-state race
          if (ablyChannel && ablyChannel.state !== 'detached' && ablyChannel.state !== 'failed') {
            await ablyChannel.presence.leave();
          }
        } catch (e) {
          // swallow detached-state errors
        }
        ablyChannel = null;
      }
      if (ablyClient) {
        try { ablyClient.close(); } catch (e) {}
        ablyClient = null;
      }
      updateStatus('disconnected', reason || 'Disconnected');
    }

    async function connectBridge(isAuto = false) {
      const pairingId = pairingInput.value.trim();
      if (!pairingId) {
        log('Error: Pairing ID cannot be empty.');
        return;
      }

      if (!isAuto) {
        reconnectAttempts = 0;
      }

      // Prevent old client's 'closed' event from scheduling a reconnect
      // after disconnectAbly() fires asynchronously.
      currentPairingId = '';
      clearReconnectTimer();

      await disconnectAbly();

      localStorage.setItem('syncingboard_pairing_id', pairingId);
      currentPairingId = pairingId;

      updateStatus('connecting', 'Connecting');
      log(`Connecting via Ably cloud relay...`);

      try {
        // Connect to Ably via authUrl (handles token refresh automatically)
        ablyClient = new Ably.Realtime({
          authUrl: `${RELAY_URL}/api/ably/token`,
          authMethod: 'GET',
          authParams: { pairingId }
        });

        // Wait for connection
        await new Promise((resolve, reject) => {
          ablyClient.connection.once('connected', resolve);
          ablyClient.connection.once('failed', (err) => reject(new Error(err.message || 'Ably connection failed')));
          // Timeout after 10s
          setTimeout(() => reject(new Error('Ably connection timed out')), 10000);
        });

        // Subscribe to the pairing channel
        ablyChannel = ablyClient.channels.get(`penpot:${pairingId}`);

        await ablyChannel.presence.enter();

        ablyChannel.subscribe('command', (message) => {
          handleCommand(message.data);
        });

        ablyChannel.presence.subscribe('leave', () => {
          // Another client left — not actionable for us.
        });

        // Connection lost handlers
        ablyClient.connection.on('disconnected', () => {
          log('Ably connection lost. Reconnecting...');
          updateStatus('connecting', 'Reconnecting');
        });

        ablyClient.connection.on('closed', () => {
          log('Ably connection closed permanently.');
          if (currentPairingId) {
            // Ably's built-in reconnect has exhausted retries; restart manually
            scheduleReconnect();
          }
        });

        reconnectAttempts = 0;
        updateStatus('connected', 'Connected');
        log('Companion connected via Ably WebSocket.');
      } catch (err) {
        await disconnectAbly();
        const errMsg = err instanceof Error ? err.message : String(err);
        log(`Connection failed: ${errMsg}`);
        updateStatus('disconnected', 'Failed');
        scheduleReconnect();
      }
    }

    async function submitResult(requestId, data, error) {
      // For selection-result (no heavy image data): send directly via Ably
      const isSelection = data && !data.svg && !data.base64;
      if (isSelection && ablyChannel) {
        try {
          await ablyChannel.publish('result', { requestId, data, error });
          log(`Selection returned directly via Ably: ${data ? data.name : 'None selected'}`);
          return;
        } catch (err) {
          log(`Ably publish failed: ${err.message}. Falling back to HTTP.`);
        }
      }

      // For heavy exports: write to Upstash Redis via Next.js HTTP POST
      try {
        const res = await fetch(`${RELAY_URL}/api/relay/penpot/result`, {
          ...FETCH_OPTIONS,
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requestId, data, error })
        });
        if (!res.ok) {
          throw new Error(`HTTP status ${res.status}`);
        }
        
        // Notify Miro directly over Ably WebSocket that the buffered image is ready in Upstash
        if (ablyChannel) {
          await ablyChannel.publish('result-ready', { requestId });
          log("Export payload uploaded and notified via Ably.");
        } else {
          log("Export payload uploaded. Warning: Ably channel disconnected, could not send event signal.");
        }
      } catch (err) {
        log(`Failed to submit result: ${err.message}`);
      }
    }

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('theme-light');
      } else if (theme === 'dark') {
        document.body.classList.remove('theme-light');
      } else if (theme === 'os') {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) {
          document.body.classList.remove('theme-light');
        } else {
          document.body.classList.add('theme-light');
        }
      }
    }

    // Apply a deterministic startup fallback before Penpot sends the exact theme.
    applyTheme('os');

    window.addEventListener("message", (event) => {
      const response = event.data;
      if (!response || !response.action) return;

      if (response.action === "ui-ready") {
        updatePluginStatus(true);
      }

      if (response.action === "theme-change") {
        applyTheme(response.theme);
        // The plugin sends theme-change in response to ui-ready; mark plugin as connected.
        updatePluginStatus(true);
      }

      if (response.action === "selection-result") {
        const request = pendingRequests.get(response.requestId);
        if (request) {
          submitResult(request.id, response.data);
          pendingRequests.delete(response.requestId);
          log(`Selection returned: ${response.data ? response.data.name : 'None selected'}`);
        }
      }

      if (response.action === "export-result") {
        const request = pendingRequests.get(response.requestId);
        if (request) {
          if (response.error) {
            submitResult(request.id, null, response.error);
            log(`Export failed: ${response.error}`);
          } else {
            submitResult(request.id, response.data);
            log("Export payload transmitted to Miro.");
          }
          pendingRequests.delete(response.requestId);
        }
      }
    });

    // Handshake: tell plugin runtime that UI is ready to receive theme updates.
    function notifyUiReady() {
      parent.postMessage({ action: 'ui-ready' }, '*');
    }

    notifyUiReady();
    setTimeout(notifyUiReady, 300);

    connectBtn.addEventListener('click', () => {
      clearReconnectTimer();
      connectBridge(false);
    });

    // Toggle pairing ID visibility
    document.getElementById('toggle-pairing-vis')?.addEventListener('click', () => {
      const input = pairingInput;
      const btn = document.getElementById('toggle-pairing-vis');
      if (!input || !btn) return;
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.setAttribute('aria-label', isHidden ? 'Hide pairing ID' : 'Show pairing ID');
      btn.innerHTML = isHidden
        ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    });

    if (savedId) {
      connectBridge(false);
    }
  </script>
</body>
</html>
