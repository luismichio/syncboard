<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SyncBoard Companion UI</title>
  <style>
    :root {
      --bg-page: #0b0c0d;
      --bg-card: #121417;
      --border-card: #1f232a;
      --text-page: #f3f4f6;
      --text-muted: #6b7280;
      --accent: #01C8F1;
      --pulse-bg: rgba(1, 200, 241, 0.08);
      --pulse-border: rgba(1, 200, 241, 0.2);
    }
    body.theme-light {
      --bg-page: #f9fafb;
      --bg-card: #ffffff;
      --border-card: #e5e7eb;
      --text-page: #111827;
      --text-muted: #9ca3af;
      --accent: #00A2C9;
      --pulse-bg: rgba(0, 162, 201, 0.08);
      --pulse-border: rgba(0, 162, 201, 0.2);
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-page);
      color: var(--text-page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px solid var(--border-card);
      padding-bottom: 12px;
    }
    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 10px;
      color: var(--text-muted);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background-color: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: 4px;
      color: var(--text-page);
      padding: 6px 8px;
      font-size: 12px;
      font-family: monospace;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      background-color: var(--accent);
      color: var(--bg-page);
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .badge {
      font-size: 9px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 12px;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-disconnected {
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.2);
    }
    .badge-connected {
      background-color: var(--pulse-bg);
      color: var(--accent);
      border-color: var(--pulse-border);
    }
    .badge-connecting {
      background-color: rgba(107, 114, 128, 0.1);
      color: var(--text-muted);
      border-color: rgba(107, 114, 128, 0.2);
    }
    .log-box {
      font-family: monospace;
      font-size: 10px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: 4px;
      padding: 8px;
      height: 80px;
      overflow-y: auto;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2>SyncBoard Companion</h2>
      <p class="subtitle">Penpot Companion Relay</p>
    </header>
    <div class="card">
      <label for="pairing-id">Miro Pairing ID</label>
      <div class="input-row">
        <input type="text" id="pairing-id" placeholder="sb_xxxxx" />
        <button id="connect-btn">Connect</button>
      </div>
    </div>
    <div class="card">
      <div class="status-row">
        <span>Relay Status:</span>
        <span id="status-badge" class="badge badge-disconnected">Disconnected</span>
      </div>
      <div class="status-row" style="margin-top: 4px;">
        <span>Active Connection:</span>
        <span id="file-name" style="color: var(--text-muted)">Stand-alone mode</span>
      </div>
    </div>
    <div class="card">
      <label>Activity Log</label>
      <div id="log" class="log-box">Initialized. Ready to pair.</div>
    </div>
  </div>
  <script>
    const RELAY_URL = window.location.origin;
    const FETCH_OPTIONS = { mode: 'cors' };

    const LONG_POLL_TIMEOUT_MS = 50000;
    const HEARTBEAT_INTERVAL_MS = 60000;
    const RECONNECT_DELAY_MS = 5000;

    let pollingActive = false;
    let pollingSession = 0;
    let reconnectTimeout = null;
    let reconnectAttempts = 0;
    let heartbeatInterval = null;

    const pendingRequests = new Map();
    const pairingInput = document.getElementById('pairing-id');
    const connectBtn = document.getElementById('connect-btn');
    const statusBadge = document.getElementById('status-badge');
    const fileNameText = document.getElementById('file-name');
    const logBox = document.getElementById('log');

    const savedId = localStorage.getItem('syncboard_pairing_id');
    if (savedId) {
      pairingInput.value = savedId;
    }

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logBox.innerHTML += `<div>[${time}] ${message}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function updateStatus(state, labelText) {
      statusBadge.textContent = labelText || state;
      statusBadge.className = 'badge';
      if (state === 'connected') {
        statusBadge.classList.add('badge-connected');
      } else if (state === 'connecting') {
        statusBadge.classList.add('badge-connecting');
      } else {
        statusBadge.classList.add('badge-disconnected');
      }
    }

    function clearReconnectTimer() {
      if (reconnectTimeout) {
        clearTimeout(reconnectTimeout);
        reconnectTimeout = null;
      }
    }

    function clearHeartbeat() {
      if (heartbeatInterval) {
        clearInterval(heartbeatInterval);
        heartbeatInterval = null;
      }
    }

    async function sendHeartbeat(pairingId) {
      const res = await fetch(`${RELAY_URL}/api/relay/penpot/register`, {
        ...FETCH_OPTIONS,
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pairingId })
      });

      if (!res.ok) {
        throw new Error(`Heartbeat failed: HTTP ${res.status}`);
      }
    }

    function scheduleReconnect() {
      if (reconnectAttempts >= 5) {
        log('Connection failed after 5 attempts. Please click Connect to retry.');
        return;
      }

      reconnectAttempts++;
      clearReconnectTimer();
      reconnectTimeout = setTimeout(() => connectBridge(true), RECONNECT_DELAY_MS);
    }

    function startHeartbeat(pairingId) {
      clearHeartbeat();
      heartbeatInterval = setInterval(async () => {
        try {
          await sendHeartbeat(pairingId);
        } catch (err) {
          // Polling path will handle reconnect; keep heartbeat noise minimal.
        }
      }, HEARTBEAT_INTERVAL_MS);
    }

    async function connectBridge(isAuto = false) {
      const pairingId = pairingInput.value.trim();
      if (!pairingId) {
        log('Error: Pairing ID cannot be empty.');
        return;
      }

      if (!isAuto) {
        reconnectAttempts = 0;
      }

      localStorage.setItem('syncboard_pairing_id', pairingId);

      pollingActive = false;
      pollingSession += 1;
      clearHeartbeat();
      clearReconnectTimer();

      updateStatus('connecting', 'Connecting');
      log(`Registering with relay (pairingId: ${pairingId})...`);

      try {
        await sendHeartbeat(pairingId);

        reconnectAttempts = 0;
        updateStatus('connected', 'Connected');
        log('Companion connected to SyncBoard relay.');
        fileNameText.textContent = 'Active Connection';

        pollingActive = true;
        const currentSession = pollingSession;
        startHeartbeat(pairingId);
        startPolling(pairingId, currentSession);
      } catch (err) {
        const errMsg = err instanceof Error ? err.message : String(err);
        log(`Connection failed: ${errMsg}`);
        updateStatus('disconnected', 'Failed');
        scheduleReconnect();
      }
    }

    async function startPolling(pairingId, sessionId) {
      while (pollingActive && sessionId === pollingSession) {
        try {
          const requestInit = { ...FETCH_OPTIONS };
          if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
            requestInit.signal = AbortSignal.timeout(LONG_POLL_TIMEOUT_MS);
          }

          const res = await fetch(`${RELAY_URL}/api/relay/penpot/poll?pairingId=${pairingId}`, requestInit);

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }

          if (!pollingActive || sessionId !== pollingSession) {
            break;
          }

          const payload = await res.json();

          if (payload.data) {
            const request = payload.data;
            log(`Received command: "${request.action}"`);

            if (request.action === 'select') {
              pendingRequests.set(request.id, request);
              parent.postMessage({
                action: 'get-selection',
                requestId: request.id
              }, '*');
            }

            if (request.action === 'export') {
              pendingRequests.set(request.id, request);
              parent.postMessage({
                action: 'export-shape',
                requestId: request.id,
                shapeId: request.shapeId,
                format: request.format || 'svg',
                scale: request.scale || 2
              }, '*');
            }
          }
        } catch (err) {
          if (!pollingActive || sessionId !== pollingSession) {
            break;
          }

          const errMsg = err instanceof Error ? err.message : String(err);
          log(`Polling error: ${errMsg}`);
          updateStatus('disconnected', 'Error');
          pollingActive = false;
          clearHeartbeat();
          scheduleReconnect();
          break;
        }
      }
    }

    async function submitResult(requestId, data, error) {
      try {
        await fetch(`${RELAY_URL}/api/relay/penpot/result`, {
          ...FETCH_OPTIONS,
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requestId, data, error })
        });
      } catch (err) {
        log(`Failed to submit result: ${err.message}`);
      }
    }

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('theme-light');
      } else if (theme === 'dark') {
        document.body.classList.remove('theme-light');
      } else if (theme === 'os') {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) {
          document.body.classList.remove('theme-light');
        } else {
          document.body.classList.add('theme-light');
        }
      }
    }

    // Apply a deterministic startup fallback before Penpot sends the exact theme.
    applyTheme('os');

    window.addEventListener("message", (event) => {
      const response = event.data;
      if (!response || !response.action) return;

      if (response.action === "theme-change") {
        applyTheme(response.theme);
      }

      if (response.action === "selection-result") {
        const request = pendingRequests.get(response.requestId);
        if (request) {
          submitResult(request.id, response.data);
          pendingRequests.delete(response.requestId);
          log(`Selection returned: ${response.data ? response.data.name : 'None selected'}`);
        }
      }

      if (response.action === "export-result") {
        const request = pendingRequests.get(response.requestId);
        if (request) {
          if (response.error) {
            submitResult(request.id, null, response.error);
            log(`Export failed: ${response.error}`);
          } else {
            submitResult(request.id, response.data);
            log("Export payload transmitted to Miro.");
          }
          pendingRequests.delete(response.requestId);
        }
      }
    });

    // Handshake: tell plugin runtime that UI is ready to receive theme updates.
    function notifyUiReady() {
      parent.postMessage({ action: 'ui-ready' }, '*');
    }

    notifyUiReady();
    setTimeout(notifyUiReady, 300);

    connectBtn.addEventListener('click', () => {
      clearReconnectTimer();
      connectBridge(false);
    });

    if (savedId) {
      connectBridge(false);
    }
  </script>
</body>
</html>
