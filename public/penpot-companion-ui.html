<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SyncBoard Companion UI</title>
  <style>
    :root {
      --bg-page: #0b0c0d;
      --bg-card: #121417;
      --border-card: #1f232a;
      --text-page: #f3f4f6;
      --text-muted: #6b7280;
      --accent: #01C8F1; /* Brand Cyan */
      --pulse-bg: rgba(1, 200, 241, 0.08);
      --pulse-border: rgba(1, 200, 241, 0.2);
    }

    body.theme-light {
      --bg-page: #f9fafb;
      --bg-card: #ffffff;
      --border-card: #e5e7eb;
      --text-page: #111827;
      --text-muted: #9ca3af;
      --accent: #00A2C9; /* Brand Deep Cyan for Light mode */
      --pulse-bg: rgba(0, 162, 201, 0.08);
      --pulse-border: rgba(0, 162, 201, 0.2);
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-page);
      color: var(--text-page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px solid var(--border-card);
      padding-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 10px;
      color: var(--text-muted);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: 4px;
      color: var(--text-page);
      padding: 6px 8px;
      font-size: 12px;
      font-family: monospace;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: var(--bg-page);
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .badge {
      font-size: 9px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 12px;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .badge-disconnected {
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.2);
    }

    .badge-connected {
      background-color: var(--pulse-bg);
      color: var(--accent);
      border-color: var(--pulse-border);
    }

    .badge-connecting {
      background-color: rgba(107, 114, 128, 0.1);
      color: var(--text-muted);
      border-color: rgba(107, 114, 128, 0.2);
    }

    .log-box {
      font-family: monospace;
      font-size: 10px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: 4px;
      padding: 8px;
      height: 80px;
      overflow-y: auto;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2>SyncBoard Companion</h2>
      <p class="subtitle">Penpot Connection Bridge</p>
    </header>

    <div class="card">
      <label for="pairing-id">Miro Pairing ID</label>
      <div class="input-row">
        <input type="text" id="pairing-id" placeholder="Paste ID from Miro Settings..." />
        <button id="connect-btn">Connect</button>
      </div>
    </div>

    <div class="card">
      <div class="status-row">
        <span>Bridge Status:</span>
        <span id="status-badge" class="badge badge-disconnected">Disconnected</span>
      </div>
      <div class="status-row" style="margin-top: 4px;">
        <span>Active Connection:</span>
        <span id="file-name" style="color: var(--text-muted)">Stand-alone mode</span>
      </div>
    </div>

    <div class="card">
      <label>Activity Log</label>
      <div id="log" class="log-box">Initialized. Ready to pair.</div>
    </div>
  </div>

  <script>
    let ws = null;
    let reconnectTimeout = null;
    let reconnectAttempts = 0;
    const pendingRequests = new Map();

    const pairingInput = document.getElementById('pairing-id');
    const connectBtn = document.getElementById('connect-btn');
    const statusBadge = document.getElementById('status-badge');
    const fileNameText = document.getElementById('file-name');
    const logBox = document.getElementById('log');

    // Restore saved pairing ID
    const savedId = localStorage.getItem('syncboard_pairing_id');
    if (savedId) {
      pairingInput.value = savedId;
    }

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logBox.innerHTML += `<div>[${time}] ${message}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function updateStatus(state, labelText) {
      statusBadge.textContent = labelText || state;
      statusBadge.className = 'badge';
      if (state === 'connected') {
        statusBadge.classList.add('badge-connected');
      } else if (state === 'connecting') {
        statusBadge.classList.add('badge-connecting');
      } else {
        statusBadge.classList.add('badge-disconnected');
      }
    }

    function connectBridge(isAuto = false) {
      const pairingId = pairingInput.value.trim();
      if (!pairingId) {
        log("Error: Pairing ID cannot be empty.");
        return;
      }

      if (!isAuto) {
        reconnectAttempts = 0;
      }

      localStorage.setItem('syncboard_pairing_id', pairingId);
      
      if (ws) {
        ws.onclose = null;
        ws.close();
      }

      updateStatus('connecting', 'Connecting...');
      if (!isAuto) {
        log(`Initiating connection to Tauri bridge...`);
      }

      // Connect to Tauri local secure loopback WS server (port 4401)
      const wsUrl = `wss://local-syncboard.luiskobayashi.com:4401/ws?pairingId=${pairingId}`;
      
      try {
        ws = new WebSocket(wsUrl);
      } catch (err) {
        log(`WS Exception: ${err.message}`);
        updateStatus('disconnected', 'Failed');
        return;
      }

      ws.onopen = () => {
        reconnectAttempts = 0;
        updateStatus('connected', 'Connected');
        log("Connection established successfully with Tauri!");
        fileNameText.textContent = 'Active Connection';
      };

      ws.onclose = () => {
        updateStatus('disconnected', 'Disconnected');
        if (reconnectAttempts < 5) {
          reconnectAttempts++;
          log(`Connection lost. Retrying (${reconnectAttempts}/5) in 5 seconds...`);
          reconnectTimeout = setTimeout(() => connectBridge(true), 5000);
        } else {
          log("Connection failed after 5 attempts. Connection stopped. Ensure SyncBridge is running and click Connect to retry.");
        }
      };

      ws.onerror = (err) => {
        log("WebSocket Connection Error.");
        updateStatus('disconnected', 'Error');
      };

      ws.onmessage = async (event) => {
        try {
          const request = JSON.parse(event.data);
          log(`Received command: "${request.action}"`);

          if (request.action === 'select') {
            log(`Querying active selection from Penpot...`);
            pendingRequests.set(request.id, request);
            
            // Post message to background script
            parent.postMessage({
              action: 'get-selection',
              requestId: request.id
            }, '*');
          }

          if (request.action === 'export') {
            log(`Exporting shape: "${request.shapeId}" (${request.format || 'svg'})...`);
            pendingRequests.set(request.id, request);

            // Post message to background script
            parent.postMessage({
              action: 'export-shape',
              requestId: request.id,
              shapeId: request.shapeId,
              format: request.format || 'svg',
              scale: request.scale || 2
            }, '*');
          }
        } catch (msgErr) {
          log(`Message processing error: ${msgErr.message}`);
        }
      };
    }

    // Theme application function
    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('theme-light');
      } else if (theme === 'dark') {
        document.body.classList.remove('theme-light');
      } else if (theme === 'os') {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) {
          document.body.classList.remove('theme-light');
        } else {
          document.body.classList.add('theme-light');
        }
      }
    }

    // Listen for messages from background script
    window.addEventListener("message", (event) => {
      const response = event.data;
      if (!response || !response.action) return;

      if (response.action === "theme-change") {
        applyTheme(response.theme);
      }

      if (response.action === "selection-result") {
        const request = pendingRequests.get(response.requestId);
        if (request && ws) {
          ws.send(JSON.stringify({
            requestId: request.id,
            data: response.data
          }));
          pendingRequests.delete(response.requestId);
          log(`Selection returned: ${response.data ? response.data.name : 'None selected'}`);
        }
      }

      if (response.action === "export-result") {
        const request = pendingRequests.get(response.requestId);
        if (request && ws) {
          if (response.error) {
            ws.send(JSON.stringify({
              requestId: request.id,
              error: response.error
            }));
            log(`Export failed: ${response.error}`);
          } else {
            ws.send(JSON.stringify({
              requestId: request.id,
              data: response.data
            }));
            log("Export payload transmitted to Miro.");
          }
          pendingRequests.delete(response.requestId);
        }
      }
    });

    connectBtn.addEventListener('click', () => {
      clearTimeout(reconnectTimeout);
      connectBridge(false);
    });

    // Auto-connect if pairing ID exists
    if (savedId) {
      connectBridge(false);
    }
  </script>
</body>
</html>
