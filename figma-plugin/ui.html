<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  background-color: #0b0c0d;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
iframe {
  flex: 1;
  border: none;
  background-color: #0b0c0d;
}
/* Figma Light Theme Override */
.figma-light body {
  background-color: #f9fafb;
}
.figma-light iframe {
  background-color: #f9fafb;
}
/* Optional preview-host footer (testing before production / self-hosting) */
.host-footer {
  border-top: 1px solid #1f232a;
  padding: 6px 10px 8px;
  background-color: #0b0c0d;
  font-size: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.figma-light .host-footer {
  border-top-color: #e5e7eb;
  background-color: #f9fafb;
}
#host-toggle {
  background: none;
  border: none;
  padding: 0;
  color: #9ca3af;
  cursor: pointer;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  text-align: left;
}
.figma-light #host-toggle { color: #6b7280; }
#host-panel { display: flex; flex-direction: column; gap: 6px; }
#host-panel[hidden] { display: none; }
#host-input {
  width: 100%;
  box-sizing: border-box;
  background-color: #121417;
  border: 1px solid #1f232a;
  border-radius: 4px;
  color: #f3f4f6;
  padding: 5px 8px;
  font-size: 11px;
  font-family: monospace;
}
.figma-light #host-input {
  background-color: #ffffff;
  color: #111827;
  border-color: #e5e7eb;
}
#host-input:focus { outline: none; border-color: #01C8F1; }
#host-hint { font-size: 9px; color: #9ca3af; line-height: 1.4; }
#host-error { font-size: 9px; color: #ef4444; min-height: 12px; }
#host-error.ok { color: #10b981; }
.host-row { display: flex; gap: 6px; }
.host-footer button {
  background-color: #121417;
  color: #f3f4f6;
  border: 1px solid #1f232a;
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 10px;
  cursor: pointer;
}
.figma-light .host-footer button {
  background-color: #ffffff;
  color: #111827;
  border-color: #e5e7eb;
}
.host-footer button:hover { opacity: 0.9; }
</style>
</head>
<body>
<iframe id="companion-iframe" src="about:blank"></iframe>
<div class="host-footer">
  <button id="host-toggle" type="button">Preview host (optional)</button>
  <div id="host-panel" hidden>
    <input id="host-input" type="text" placeholder="https://your-host.example" />
    <div id="host-hint">Optional. Prefilled with the current host; empty = production companion. The iframe can only load hosts listed in this plugin's <code>allowedDomains</code> (dev: <code>devAllowedDomains</code>) — self-hosters add their domain to their own copy of the manifest.</div>
    <div class="host-row">
      <button id="host-save" type="button">Apply</button>
      <button id="host-clear" type="button">Use default</button>
    </div>
    <div id="host-error"></div>
  </div>
</div>
<script>
const DEFAULT_HOST = 'https://www.syncingboard.com';
const iframe = document.getElementById('companion-iframe');
let currentFileKey = 'unknown';
let previewHost = '';

// Load the hosted companion into the iframe. The production host is fixed
// (see manifest networkAccess.allowedDomains); self-hosters edit DEFAULT_HOST
// in this file before importing the plugin from the local manifest.
function loadIframe() {
  const urlParams = new URLSearchParams(window.location.search);
  const secretKey = urlParams.get('key');
  const host = previewHost || DEFAULT_HOST;
  let targetUrl = `${host}/figma-companion-ui.html?fileKey=${encodeURIComponent(currentFileKey)}`;
  if (secretKey) {
    targetUrl += `&key=${encodeURIComponent(secretKey)}`;
  }
  iframe.src = targetUrl;
}

// Ask the background script for the file key + preview host on startup
parent.postMessage({ pluginMessage: { action: 'ui-ready' } }, '*');
parent.postMessage({ pluginMessage: { action: 'get-host-config' } }, '*');

// Figma adds figma-light or figma-dark to <html> when themeColors: true
function getActiveTheme() {
  return document.documentElement.classList.contains('figma-light') ? 'light' : 'dark';
}
function sendThemeToIframe() {
  const theme = getActiveTheme();
  if (iframe.contentWindow) {
    iframe.contentWindow.postMessage({ action: 'theme-change', theme }, '*');
  }
}
// Listen for live theme switches in the editor
const themeObserver = new MutationObserver(() => {
  sendThemeToIframe();
});
themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

// Messages from the background script (figma.ui.postMessage)
window.onmessage = (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;
  if (msg.action === 'file-key') {
    currentFileKey = msg.fileKey || currentFileKey || 'unknown';
    loadIframe();
    return;
  }
  if (msg.action === 'host-config') {
    previewHost = msg.previewHost || '';
    const input = document.getElementById('host-input');
    // Pre-fill with the effective host so Apply/Use default is always meaningful.
    if (input) input.value = previewHost || DEFAULT_HOST;
    const panel = document.getElementById('host-panel');
    if (previewHost && panel) panel.hidden = false;
    // Always reload so Apply / Use default gives visible feedback.
    loadIframe();
    return;
  }
  // Forward everything else (selection results, etc.) to the hosted companion
  if (iframe.contentWindow) {
    iframe.contentWindow.postMessage(msg, '*');
  }
};

// Messages from the hosted companion -> background script
window.addEventListener('message', (event) => {
  if (event.source !== iframe.contentWindow) return;
  const data = event.data || {};
  // The companion announces readiness once loaded; reply with the theme.
  // Do not forward this to the background script (it would loop on file-key).
  if (data.action === 'ui-ready') {
    sendThemeToIframe();
    return;
  }
  parent.postMessage({ pluginMessage: data }, '*');
});

// Preview-host footer wiring (optional testing/self-host target)
(function () {
  const toggle = document.getElementById('host-toggle');
  const panel = document.getElementById('host-panel');
  const input = document.getElementById('host-input');
  const save = document.getElementById('host-save');
  const clear = document.getElementById('host-clear');
  const error = document.getElementById('host-error');

  toggle.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    toggle.textContent = panel.hidden ? 'Preview host (optional)' : 'Hide preview host';
  });

  function validateInput() {
    const raw = input.value.trim();
    if (!raw) return true;
    const withScheme = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
    try {
      const u = new URL(withScheme);
      return (u.protocol === 'http:' || u.protocol === 'https:') && !!u.hostname;
    } catch (e) {
      return false;
    }
  }

  function flashStatus(text) {
    error.textContent = text;
    error.classList.add('ok');
    clearTimeout(flashStatus.timer);
    flashStatus.timer = setTimeout(() => {
      error.textContent = '';
      error.classList.remove('ok');
    }, 2500);
  }

  save.addEventListener('click', () => {
    const raw = input.value.trim();
    if (raw && !validateInput()) {
      error.textContent = 'Enter a valid http(s)://host[:port] URL.';
      return;
    }
    flashStatus('Applied ✓ reloading...');
    parent.postMessage({ pluginMessage: { action: 'set-preview-host', host: raw } }, '*');
  });

  clear.addEventListener('click', () => {
    input.value = '';
    flashStatus('Using default host ✓ reloading...');
    parent.postMessage({ pluginMessage: { action: 'set-preview-host', host: '' } }, '*');
  });
})();
</script>
</body>
</html>
